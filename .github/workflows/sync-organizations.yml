name: Sync organization database

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      full_import:
        description: Run full BRREG import (rebuild from scratch; deletes DB with --fresh)
        type: boolean
        default: false
      backfill:
        description: Backfill new columns + underenheter into existing DB (no delete)
        type: boolean
        default: false
      geocode_only:
        description: Only geocode pending addresses (skip BRREG sync)
        type: boolean
        default: false
      geocode_limit:
        description: Max unique addresses to geocode per batch
        type: string
        default: '5000'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Download existing database
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          if gh release view database >/dev/null 2>&1; then
            gh release download database --pattern 'organizations.db' --dir data --clobber
            echo "Loaded existing database from release"
            echo "has_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "No existing database release found – will start initial build"
            echo "has_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync database
        env:
          HAS_RELEASE: ${{ steps.download.outputs.has_release }}
          FULL_IMPORT: ${{ github.event.inputs.full_import || 'false' }}
          BACKFILL: ${{ github.event.inputs.backfill || 'false' }}
          GEOCODE_ONLY: ${{ github.event.inputs.geocode_only || 'false' }}
          GEOCODE_LIMIT: ${{ github.event.inputs.geocode_limit || '5000' }}
          SYNC_GEOCODE_CONCURRENCY: '3'
          GEOCODE_DELAY_MS: '200'
          BUILD_DB_MAX_GEOCODE_ADDRESSES: '30000'
        run: |
          set -euo pipefail

          if [ "$GEOCODE_ONLY" = "true" ]; then
            echo "Modus: kun geokoding"
            export SYNC_GEOCODE_LIMIT="$GEOCODE_LIMIT"
            yarn sync:geocode --geocode-limit="$GEOCODE_LIMIT"
          elif [ "$FULL_IMPORT" = "true" ]; then
            echo "Modus: full import (manuell) – enheter + underenheter"
            export SYNC_GEOCODE_LIMIT=5000
            export BUILD_DB_MAX_ROUNDS=6
            export BUILD_DB_MAX_GEOCODE_ADDRESSES=50000
            yarn build-db --fresh
          elif [ "$BACKFILL" = "true" ]; then
            echo "Modus: backfill – oppdaterer eksisterende database fra BRREG bulk"
            export SYNC_GEOCODE_LIMIT=5000
            export BUILD_DB_MAX_ROUNDS=6
            export BUILD_DB_MAX_GEOCODE_ADDRESSES=50000
            yarn build-db --backfill --regeocode-metadata
          elif [ "$HAS_RELEASE" = "false" ]; then
            echo "Modus: første bygg – full BRREG-import (enheter + underenheter) + geokode inntil kvote"
            export SYNC_GEOCODE_LIMIT=5000
            export BUILD_DB_MAX_ROUNDS=6
            export BUILD_DB_MAX_GEOCODE_ADDRESSES=50000
            yarn build-db --fresh
          else
            echo "Modus: inkrementell BRREG-sync + geokode nye/endrede adresser"
            export SYNC_GEOCODE_LIMIT=5000
            export BUILD_DB_MAX_ROUNDS=6
            yarn build-db
          fi

      - name: Publish database release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: database
          name: Organization database
          body: |
            Organization database sync.

            Run: ${{ github.run_id }}
            Time: ${{ github.run_started_at }}
            Mode: ${{ steps.download.outputs.has_release == 'false' && 'initial build' || 'incremental sync' }}
          files: data/organizations.db
          make_latest: true
          overwrite_files: true

      - name: Install tippecanoe
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev zlib1g-dev
          git clone --depth 1 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          make -C /tmp/tippecanoe -j"$(nproc)"
          sudo make -C /tmp/tippecanoe install

      - name: Install PMTiles CLI
        run: |
          curl -L https://github.com/protomaps/go-pmtiles/releases/download/v1.31.1/go-pmtiles_1.31.1_Linux_x86_64.tar.gz \
            | sudo tar xz -C /usr/local/bin pmtiles

      - name: Export map tiles (LOD pyramid)
        run: yarn export-map-tiles

      - name: Publish vector tiles release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: points
          name: Organization point tiles
          body: |
            Pre-built PMTiles vector tiles for default map filters.

            Run: ${{ github.run_id }}
            Time: ${{ github.run_started_at }}
          files: |
            public/data/points.pmtiles
            public/data/points/manifest.json
          make_latest: true
          overwrite_files: true
