name: Build organization database

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build national database
        env:
          DATABASE_PATH: data/organizations.db
        run: yarn build-national-db --fresh

      - name: Publish database release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: database
          name: Organization database
          body: |
            Full national database built from BRREG + Kartverket bulk data.
            All geocoding done locally against Kartverket CSV (no API).

            Run: ${{ github.run_id }}
            Time: ${{ github.run_started_at }}
          files: data/organizations.db
          make_latest: true
          overwrite_files: true

      - name: Install tippecanoe
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev zlib1g-dev
          git clone --depth 1 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          make -C /tmp/tippecanoe -j"$(nproc)"
          sudo make -C /tmp/tippecanoe install

      - name: Install PMTiles CLI
        run: |
          curl -L https://github.com/protomaps/go-pmtiles/releases/download/v1.31.1/go-pmtiles_1.31.1_Linux_x86_64.tar.gz \
            | sudo tar xz -C /usr/local/bin pmtiles

      - name: Export map tiles (LOD pyramid)
        run: |
          yarn download-kommuner
          yarn download-grunnkretser
          yarn export-map-tiles
          tar -C public/data -czf public/data/districts.tar.gz districts

      - name: Publish vector tiles release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: points
          name: Organization point tiles
          body: |
            Pre-built PMTiles vector tiles for default map filters,
            plus district/grunnkrets colour GeoJSON (`districts.tar.gz`).

            Run: ${{ github.run_id }}
            Time: ${{ github.run_started_at }}
          files: |
            public/data/points.pmtiles
            public/data/points/manifest.json
            public/data/districts.tar.gz
          make_latest: true
          overwrite_files: true
