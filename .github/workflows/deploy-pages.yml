name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Sync organization database]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Download static data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p public/data/points data

          yarn download-kommuner

          if gh release view points >/dev/null 2>&1; then
            gh release download points --pattern 'points.pmtiles' --dir public/data --clobber
            gh release download points --pattern 'manifest.json' --dir public/data/points --clobber
            echo "Loaded vector tiles from release"

            if gh release download points --pattern 'districts.tar.gz' --dir public/data --clobber 2>/dev/null; then
              tar -C public/data -xzf public/data/districts.tar.gz
              rm -f public/data/districts.tar.gz
              echo "Loaded prebuilt district colours from release"
              echo "DISTRICTS_PREBUILT=1" >> "$GITHUB_ENV"
            else
              echo "No districts.tar.gz in points release – will rebuild"
            fi
          else
            echo "No points release yet – dots mode will use exported geocoded-points.json"
          fi

          if [ "${DISTRICTS_PREBUILT:-}" != "1" ]; then
            yarn download-grunnkretser
          fi

          if gh release view database >/dev/null 2>&1; then
            gh release download database --pattern 'organizations.db' --dir data --clobber
            echo "Loaded organizations.db from release"
          else
            echo "No database release yet – static API export will be skipped"
          fi

      - name: Export static API
        if: hashFiles('data/organizations.db') != ''
        env:
          DISTRICTS_SKIP_EXPORT: ${{ env.DISTRICTS_PREBUILT == '1' && '1' || '' }}
        run: yarn export-static-api

      - name: Build site
        env:
          GITHUB_PAGES: 'true'
          VITE_BASE: /
          VITE_STATIC_API: ${{ hashFiles('data/organizations.db') != '' && 'true' || '' }}
          VITE_HAS_PMTILES: ${{ hashFiles('public/data/points.pmtiles') != '' && 'true' || '' }}
        run: yarn build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
