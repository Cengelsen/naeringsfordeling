name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Build organization database]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  quality:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4 # 11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@v4 # 49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Type check
        run: yarn check

      - name: Test
        run: yarn test

  build:
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4 # 11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@v4 # 49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Download static data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p public/data/points data public/data/api

          yarn download-kommuner

          if gh release view points >/dev/null 2>&1; then
            gh release download points --pattern 'points.pmtiles' --dir public/data --clobber
            gh release download points --pattern 'manifest.json' --dir public/data/points --clobber
            echo "Loaded vector tiles from release"

            if gh release download points --pattern 'static-api.tar.gz' --dir public/data --clobber 2>/dev/null; then
              tar -C public/data/api -xzf public/data/static-api.tar.gz
              rm -f public/data/static-api.tar.gz
              echo "Loaded static API assets from release"
              echo "STATIC_API_PREBUILT=1" >> "$GITHUB_ENV"
            else
              echo "No static-api.tar.gz in points release yet"
            fi

            if gh release download points --pattern 'districts.tar.gz' --dir public/data --clobber 2>/dev/null; then
              tar -C public/data -xzf public/data/districts.tar.gz
              rm -f public/data/districts.tar.gz
              echo "Loaded prebuilt district colours from release"
              echo "DISTRICTS_PREBUILT=1" >> "$GITHUB_ENV"
            else
              echo "No districts.tar.gz in points release – will rebuild"
            fi
          else
            echo "No points release yet – dots mode will use vector tiles"
          fi

          if [ "${DISTRICTS_PREBUILT:-}" != "1" ]; then
            yarn download-grunnkretser
          fi

          # Only download the database if static API was not pre-built
          if [ "${STATIC_API_PREBUILT:-}" != "1" ]; then
            if gh release view database >/dev/null 2>&1; then
              gh release download database --pattern 'organizations-publish.db' --dir data --clobber 2>/dev/null \
                || gh release download database --pattern 'organizations.db' --dir data --clobber 2>/dev/null \
                || true
              if [ -f data/organizations-publish.db ]; then
                mv data/organizations-publish.db data/organizations.db
              fi
              if [ -f data/organizations.db ]; then
                echo "Loaded organizations.db from release (for static API export)"
              fi
            fi
          fi

      - name: Export static API (fallback if not pre-built)
        if: env.STATIC_API_PREBUILT != '1' && hashFiles('data/organizations.db') != ''
        env:
          DISTRICTS_SKIP_EXPORT: ${{ env.DISTRICTS_PREBUILT == '1' && '1' || '' }}
        run: yarn export-static-api

      - name: Build site
        env:
          GITHUB_PAGES: 'true'
          VITE_BASE: /
          VITE_STATIC_API: ${{ (env.STATIC_API_PREBUILT == '1' || hashFiles('data/organizations.db') != '') && 'true' || '' }}
        run: yarn build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3 # 56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 # d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
